# Reverse proxy only — never serves source directories or static files
# directly from disk. Each app is a Docker service reached over the internal
# compose network; nginx is the only thing with a public port.
#
# Replace example.com below with your real domain before deploying. Start
# with HTTP-only (as below) to get certbot's webroot challenge working, then
# follow deploy/README.md to issue certs and uncomment the HTTPS blocks.

upstream client_app {
    server client:3000;
}

upstream admin_app {
    server admin:3001;
}

upstream backend_app {
    server backend:8000;
}

# ---- Public site: example.com ----
server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://client_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Admin panel: admin.example.com ----
server {
    listen 80;
    server_name admin.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- API: api.example.com ----
server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- After running certbot (see deploy/README.md), uncomment these three
# blocks, reload nginx, and add a `return 301 https://$host$request_uri;`
# to each HTTP server{} location / above so plain HTTP redirects to HTTPS. ----

